<html>

<head>
  <title>Arabesque Labs Ltd. | Contact</title>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="Viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Get in touch with Arabesque Labs." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 100 100" width="28" height="28" aria-hidden="true">
        <rect x="20" y="20" width="60" height="60" />
        <rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)" />
      </svg>
      <span class="brand-name">ARABESQUE LABS</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="work.html">Approach</a></li>
      <li><a href="contact.html" aria-current="page">Contact</a></li>
    </ul>
  </header>

  <main>
    <section class="section" style="border-top: none; padding-top: 24px;">
      <p class="section-kicker">Contact</p>
      <h2 class="section-heading">Say hello</h2>
      <p class="section-lede">
        Have a question, or just want to say hi? Send us a note and we'll get back to you.
      </p>

      <form class="contact-form" action="mailto:hello@arabesquelabs.com" method="post" enctype="text/plain">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <button class="button button-primary" type="submit" style="border: none; cursor: pointer;">Send</button>
      </form>

      <p class="contact-alt">
        Prefer email? Reach us directly at <a href="mailto:hello@arabesquelabs.com">hello@arabesquelabs.com</a>.
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Arabesque Labs Ltd.</p>
    <nav>
      <a href="about.html">About</a>
      <a href="work.html">Approach</a>
      <a href="contact.html">Contact</a>
    </nav>
  </footer>
</body>

</html>
